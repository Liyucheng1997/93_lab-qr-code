<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>表单 · Smart QR Manager</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="nav" id="nav"></header>

  <div class="container">
    <div class="page-head split">
      <div>
        <h1 class="page-title">表单</h1>
        <p class="page-sub">自定义要收集的信息，生成二维码，扫码即可填写。</p>
      </div>
      <a class="btn" id="createBtn" href="/form-builder.html"><span data-icon="plus"></span>创建表单</a>
    </div>

    <div class="msg" id="msg"></div>
    <div id="list"></div>
  </div>

  <footer id="footer"></footer>

  <script src="/app.js"></script>
  <script>
    (async () => {
      await renderNav('forms');
      const me = await requireAuth();
      if (!me) return;
      const createHref = me.isMember ? '/form-builder.html' : '/upgrade.html';
      document.getElementById('createBtn').href = createHref;
      const list = document.getElementById('list');
      try {
        const items = await api('/api/forms');
        if (!items.length) {
          list.innerHTML = `<div class="card flush">${emptyState('form', '还没有表单',
            '设计一份表单并生成二维码，扫码的人填写后会在这里汇总。',
            `<a class="btn" href="${createHref}">${icon('plus')}创建表单</a>`)}</div>`;
          return;
        }
        list.innerHTML = `<div class="list">` + items.map((f) => `
          <div class="list-row" data-href="/form-detail.html?id=${f.id}">
            <img class="list-thumb" src="/api/forms/${f.id}/image" alt="" />
            <div class="list-main">
              <h3 class="list-title">${escapeHtml(f.title)}</h3>
              <div class="list-sub">${escapeHtml(f.description || '无说明')}</div>
              <div class="list-meta">${f.fieldCount} 个字段 · 创建于 ${fmtDate(f.createdAt)}</div>
            </div>
            <div class="list-stat"><div class="n">${fmtNum(f.submissionCount)}</div><div class="l">份提交</div></div>
            <div class="list-actions">
              <a class="btn ghost sm" href="/form-submissions.html?id=${f.id}">结果</a>
              <a class="btn ghost sm" href="/form-builder.html?id=${f.id}">编辑</a>
            </div>
            <span class="list-chevron">${icon('chevron-right')}</span>
          </div>`).join('') + `</div>`;
      } catch (err) {
        showMsg(document.getElementById('msg'), err.message, 'err');
      }
    })();
  </script>
</body>
</html>
