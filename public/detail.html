<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>二维码详情 · Smart QR Manager</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="nav" id="nav"></header>

  <div class="container">
    <a href="/dashboard.html" class="back"><span data-icon="chevron-left"></span>二维码</a>
    <div class="msg" id="msg"></div>

    <div class="detail-grid" id="content" hidden>
      <div class="card qr-card">
        <div class="qr-frame"><img id="qrImg" width="248" height="248" alt="二维码" /></div>
        <a class="btn" id="download" download="qrcode.png"><span data-icon="download"></span>下载 PNG</a>
        <div class="qr-note">扫码即记录一次访问</div>
      </div>

      <div class="card">
        <div class="page-head" style="margin-bottom: 22px">
          <h1 class="page-title" id="title"></h1>
        </div>

        <div class="field">
          <label>目标链接</label>
          <a id="target" href="#" target="_blank" rel="noopener" style="word-break: break-all"></a>
        </div>

        <div class="field">
          <label>追踪短链（二维码实际编码内容）</label>
          <div class="copy-field">
            <input id="redirect" readonly />
            <button class="btn ghost sm" id="copyBtn"><span data-icon="copy"></span>复制</button>
          </div>
        </div>

        <div class="divider"></div>

        <div class="stat-pair">
          <div>
            <div class="stat-num" id="scanCount">0</div>
            <div class="stat-label">累计扫码</div>
          </div>
          <div>
            <div class="stat-num sm" id="created"></div>
            <div class="stat-label">创建时间</div>
          </div>
        </div>

        <div class="row wrap mt-4">
          <a class="btn" id="statsLink"><span data-icon="chart"></span>查看统计</a>
          <a class="btn ghost" id="editLink"><span data-icon="edit"></span>编辑</a>
          <button class="btn danger" id="deleteBtn"><span data-icon="trash"></span>删除</button>
        </div>
      </div>
    </div>
  </div>

  <footer id="footer"></footer>

  <script src="/app.js"></script>
  <script>
    (async () => {
      await renderNav('dashboard');
      if (!(await requireAuth())) return;
      const id = qs('id');
      const msg = document.getElementById('msg');
      if (!id) { showMsg(msg, '缺少二维码 ID', 'err'); return; }
      try {
        const q = await api('/api/qrcodes/' + id);
        document.getElementById('content').hidden = false;
        document.getElementById('title').textContent = q.title;
        document.title = q.title + ' · Smart QR Manager';
        const target = document.getElementById('target');
        target.textContent = q.target; target.href = q.target;
        document.getElementById('redirect').value = q.redirectUrl;
        document.getElementById('scanCount').textContent = fmtNum(q.scanCount);
        document.getElementById('created').textContent = fmtDate(q.createdAt);
        const img = document.getElementById('qrImg');
        img.src = '/api/qrcodes/' + id + '/image';
        document.getElementById('download').href = '/api/qrcodes/' + id + '/image';
        document.getElementById('statsLink').href = '/stats.html?id=' + id;
        document.getElementById('editLink').href = '/edit.html?id=' + id;

        document.getElementById('copyBtn').addEventListener('click', () => {
          navigator.clipboard.writeText(q.redirectUrl);
          showMsg(msg, '已复制追踪链接', 'ok');
        });
        document.getElementById('deleteBtn').addEventListener('click', async () => {
          if (!confirm('确定删除该二维码？其扫码记录也会一并删除。')) return;
          await api('/api/qrcodes/' + id, { method: 'DELETE' });
          location.href = '/dashboard.html';
        });
      } catch (err) {
        showMsg(msg, err.message, 'err');
      }
    })();
  </script>
</body>
</html>
