<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>二维码 · Smart QR Manager</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="nav" id="nav"></header>

  <div class="container">
    <div class="page-head split">
      <div>
        <h1 class="page-title">二维码</h1>
        <p class="page-sub">你的全部动态二维码</p>
      </div>
      <a class="btn" href="/create.html"><span data-icon="plus"></span>创建二维码</a>
    </div>

    <div class="msg" id="msg"></div>
    <div id="list"></div>
  </div>

  <footer id="footer"></footer>

  <script src="/app.js"></script>
  <script>
    (async () => {
      await renderNav('dashboard');
      const me = await requireAuth();
      if (!me) return;
      const list = document.getElementById('list');
      try {
        const items = await api('/api/qrcodes');
        if (!items.length) {
          list.innerHTML = `<div class="card flush">${emptyState('qr', '还没有二维码',
            '创建第一个动态二维码，之后随时可以更换它的跳转链接。',
            `<a class="btn" href="/create.html">${icon('plus')}创建二维码</a>`)}</div>`;
          return;
        }
        list.innerHTML = `<div class="list">` + items.map((q) => `
          <div class="list-row" data-href="/detail.html?id=${q.id}">
            <img class="list-thumb" src="/api/qrcodes/${q.id}/image" alt="" />
            <div class="list-main">
              <h3 class="list-title">${escapeHtml(q.title)}</h3>
              <div class="list-sub">${escapeHtml(q.target)}</div>
              <div class="list-meta">创建于 ${fmtDate(q.createdAt)}</div>
            </div>
            <div class="list-stat"><div class="n">${fmtNum(q.scanCount)}</div><div class="l">次扫码</div></div>
            <div class="list-actions">
              <a class="btn ghost sm" href="/stats.html?id=${q.id}">统计</a>
              <a class="btn ghost sm" href="/edit.html?id=${q.id}">编辑</a>
            </div>
            <span class="list-chevron">${icon('chevron-right')}</span>
          </div>`).join('') + `</div>`;
      } catch (err) {
        showMsg(document.getElementById('msg'), err.message, 'err');
      }
    })();
  </script>
</body>
</html>
