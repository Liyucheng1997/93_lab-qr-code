<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>填写表单 · Smart QR Manager</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="fill" data-theme="classic">
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="/"><span data-icon="logo" data-size="20"></span><span>Smart QR<span class="brand-ext"> Manager</span></span></a>
    </div>
  </header>

  <div class="fill-wrap">
    <div class="msg" id="msg"></div>

    <div class="card" id="card">
      <div class="fill-head">
        <img id="logo" class="fill-logo" hidden alt="" />
        <h1 id="title"></h1>
        <p id="desc"></p>
      </div>
      <form id="form" novalidate></form>
      <button class="btn block mt-3" id="submitBtn">提交</button>
    </div>

    <div class="card done" id="done" hidden>
      <div class="done-icon"><span data-icon="check" data-size="34" data-stroke="2.4"></span></div>
      <h2>已提交</h2>
      <p>感谢你的填写。</p>
    </div>
  </div>

  <footer id="footer"></footer>

  <script src="/app.js"></script>
  <script>
    const id = location.pathname.split('/').filter(Boolean).pop();
    let fields = [];

    function fieldHtml(f) {
      const req = f.required ? '<span class="req">*</span>' : '';
      let control = '';
      if (f.type === 'textarea') {
        control = `<textarea rows="3" data-fid="${f.id}"></textarea>`;
      } else if (f.type === 'select') {
        control = `<select data-fid="${f.id}"><option value="">请选择</option>${
          (f.options || []).map((o) => `<option value="${escapeHtml(o)}">${escapeHtml(o)}</option>`).join('')
        }</select>`;
      } else if (f.type === 'radio') {
        control = `<div class="opt-list">` + (f.options || []).map((o) =>
          `<label class="opt"><input type="radio" name="${f.id}" value="${escapeHtml(o)}"/><span>${escapeHtml(o)}</span></label>`
        ).join('') + `</div>`;
      } else if (f.type === 'checkbox') {
        control = `<div class="opt-list">` + (f.options || []).map((o) =>
          `<label class="opt"><input type="checkbox" data-cb="${f.id}" value="${escapeHtml(o)}"/><span>${escapeHtml(o)}</span></label>`
        ).join('') + `</div>`;
      } else {
        const t = ['email', 'tel', 'number', 'date'].includes(f.type) ? f.type : 'text';
        control = `<input type="${t}" data-fid="${f.id}" />`;
      }
      return `<div class="field"><label>${escapeHtml(f.label)}${req}</label>${control}</div>`;
    }

    function collect() {
      const data = {};
      for (const f of fields) {
        if (f.type === 'checkbox') {
          data[f.id] = [...document.querySelectorAll(`[data-cb="${f.id}"]:checked`)].map((el) => el.value);
        } else if (f.type === 'radio') {
          const el = document.querySelector(`input[name="${f.id}"]:checked`);
          data[f.id] = el ? el.value : '';
        } else {
          const el = document.querySelector(`[data-fid="${f.id}"]`);
          data[f.id] = el ? el.value.trim() : '';
        }
      }
      return data;
    }

    (async () => {
      hydrateIcons();
      renderFooter();
      const msg = document.getElementById('msg');
      let form;
      try { form = await api('/api/public/forms/' + id); }
      catch (err) {
        document.getElementById('card').hidden = true;
        showMsg(msg, err.message, 'err');
        return;
      }
      fields = form.fields || [];
      if (form.theme) document.body.setAttribute('data-theme', form.theme);
      document.title = form.title + ' · 填写表单';
      document.getElementById('title').textContent = form.title;
      const desc = document.getElementById('desc');
      if (form.description) desc.textContent = form.description; else desc.hidden = true;
      if (form.logo) { const l = document.getElementById('logo'); l.src = form.logo; l.hidden = false; }
      document.getElementById('form').innerHTML = fields.map(fieldHtml).join('');
      document.getElementById('form').addEventListener('submit', (e) => e.preventDefault());

      const btn = document.getElementById('submitBtn');
      btn.addEventListener('click', async () => {
        const data = collect();
        // client-side required check
        for (const f of fields) {
          const v = data[f.id];
          const empty = f.type === 'checkbox' ? !v.length : !v;
          if (f.required && empty) {
            showMsg(msg, `「${f.label}」为必填项`, 'err');
            window.scrollTo({ top: 0, behavior: 'smooth' });
            return;
          }
        }
        btn.disabled = true;
        try {
          await api('/api/public/forms/' + id + '/submit', {
            method: 'POST', body: JSON.stringify({ data }),
          });
          document.getElementById('card').hidden = true;
          document.getElementById('done').hidden = false;
          hideMsg(msg);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (err) { showMsg(msg, err.message, 'err'); btn.disabled = false; }
      });
    })();
  </script>
</body>
</html>
