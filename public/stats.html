<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>扫码统计 · Smart QR Manager</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .chart-box { position: relative; height: 240px; }
    .chart-box canvas { width: 100% !important; height: 100% !important; }
  </style>
</head>
<body>
  <header class="nav" id="nav"></header>

  <div class="container">
    <a href="#" id="back" class="back"><span data-icon="chevron-left"></span>详情</a>
    <div class="page-head">
      <h1 class="page-title" id="title">扫码统计</h1>
      <p class="page-sub" id="sub">扫码次数、趋势与设备分布</p>
    </div>
    <div class="msg" id="msg"></div>

    <div id="content" hidden>
      <div class="grid grid-3 stat-grid">
        <div class="card"><div class="stat-num" id="total">0</div><div class="stat-label">累计扫码</div></div>
        <div class="card"><div class="stat-num" id="today">0</div><div class="stat-label">今日扫码</div></div>
        <div class="card"><div class="stat-num sm" id="last">—</div><div class="stat-label">最近一次扫码</div></div>
      </div>

      <div class="grid grid-2 mt-2" style="align-items: start">
        <div class="card">
          <h3 class="card-title">最近 14 天</h3>
          <div class="chart-box"><canvas id="trendChart"></canvas></div>
        </div>
        <div class="card">
          <h3 class="card-title">设备类型</h3>
          <div class="chart-box"><canvas id="deviceChart"></canvas></div>
          <div class="muted center small" id="deviceEmpty" hidden style="padding: 40px 0">暂无扫码数据</div>
        </div>
      </div>
    </div>
  </div>

  <footer id="footer"></footer>

  <script src="/vendor/chart.umd.js"></script>
  <script src="/app.js"></script>
  <script>
    (async () => {
      await renderNav('dashboard');
      if (!(await requireAuth())) return;
      const id = qs('id');
      const msg = document.getElementById('msg');
      document.getElementById('back').href = '/detail.html?id=' + id;
      if (!id) { showMsg(msg, '缺少二维码 ID', 'err'); return; }

      let s;
      try { s = await api('/api/qrcodes/' + id + '/stats'); }
      catch (err) { showMsg(msg, err.message, 'err'); return; }

      document.getElementById('content').hidden = false;
      document.getElementById('title').textContent = s.title;
      document.title = s.title + ' · 扫码统计';
      document.getElementById('total').textContent = fmtNum(s.total);
      document.getElementById('today').textContent = fmtNum(s.today);
      document.getElementById('last').textContent = fmtDate(s.lastScan);

      Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
      Chart.defaults.font.size = 12;
      Chart.defaults.color = '#86868b';

      // Trend line
      const tc = document.getElementById('trendChart');
      const g = tc.getContext('2d').createLinearGradient(0, 0, 0, 240);
      g.addColorStop(0, 'rgba(0,113,227,0.22)');
      g.addColorStop(1, 'rgba(0,113,227,0)');
      new Chart(tc, {
        type: 'line',
        data: {
          labels: s.trend.map((t) => t.date.slice(5)),
          datasets: [{
            label: '扫码次数',
            data: s.trend.map((t) => t.count),
            borderColor: '#0071e3',
            borderWidth: 2,
            backgroundColor: g,
            fill: true, tension: 0.4,
            pointRadius: 0, pointHoverRadius: 5,
            pointHoverBackgroundColor: '#0071e3', pointHoverBorderColor: '#fff', pointHoverBorderWidth: 2,
          }],
        },
        options: {
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { display: false },
            tooltip: { backgroundColor: '#1d1d1f', padding: 10, cornerRadius: 8, displayColors: false },
          },
          scales: {
            x: { grid: { display: false }, border: { display: false } },
            y: { beginAtZero: true, ticks: { precision: 0, maxTicksLimit: 5 }, grid: { color: 'rgba(0,0,0,0.05)' }, border: { display: false } },
          },
        },
      });

      // Device doughnut
      const dv = s.devices;
      const dvTotal = dv.mobile + dv.tablet + dv.desktop;
      if (dvTotal === 0) {
        document.getElementById('deviceChart').parentElement.hidden = true;
        document.getElementById('deviceEmpty').hidden = false;
      } else {
        new Chart(document.getElementById('deviceChart'), {
          type: 'doughnut',
          data: {
            labels: ['手机', '平板', '电脑'],
            datasets: [{
              data: [dv.mobile, dv.tablet, dv.desktop],
              backgroundColor: ['#0071e3', '#5ac8fa', '#d2d2d7'],
              borderWidth: 0, hoverOffset: 6,
            }],
          },
          options: {
            maintainAspectRatio: false,
            cutout: '70%',
            plugins: {
              legend: { position: 'bottom', labels: { usePointStyle: true, pointStyle: 'circle', padding: 18 } },
              tooltip: { backgroundColor: '#1d1d1f', padding: 10, cornerRadius: 8 },
            },
          },
        });
      }
    })();
  </script>
</body>
</html>
