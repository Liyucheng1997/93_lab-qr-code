<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · Smart QR Manager</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="nav" id="nav"></header>

  <div class="container narrow-sm">
    <div class="auth-head">
      <div class="auth-logo"><span data-icon="logo" data-size="28"></span></div>
      <h1 class="page-title" id="formTitle">登录</h1>
      <p class="page-sub" id="formSub">使用邮箱登录你的账户</p>
    </div>

    <div class="card">
      <div class="segmented" id="seg">
        <button type="button" class="on" data-mode="login">登录</button>
        <button type="button" data-mode="register">注册</button>
      </div>

      <div class="msg" id="msg"></div>

      <div class="field" id="nameField" hidden>
        <label for="name">昵称（可选）</label>
        <input id="name" placeholder="你的名字" autocomplete="nickname" />
      </div>

      <div class="field">
        <label for="email">邮箱</label>
        <input id="email" type="email" placeholder="you@example.com" autocomplete="email" />
      </div>

      <div class="field">
        <label for="password">密码</label>
        <input id="password" type="password" placeholder="至少 6 位" autocomplete="current-password" />
      </div>

      <button class="btn block mt-3" id="submitBtn">登录</button>
    </div>
  </div>

  <footer id="footer"></footer>

  <script src="/app.js"></script>
  <script>
    renderNav('login');
    let mode = 'login';
    const msg = document.getElementById('msg');
    const nameField = document.getElementById('nameField');
    const formTitle = document.getElementById('formTitle');
    const formSub = document.getElementById('formSub');
    const submitBtn = document.getElementById('submitBtn');
    const seg = document.getElementById('seg');

    seg.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => {
      mode = b.dataset.mode;
      const isReg = mode === 'register';
      seg.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
      formTitle.textContent = isReg ? '创建账户' : '登录';
      formSub.textContent = isReg ? '只需一个邮箱，免费开始' : '使用邮箱登录你的账户';
      submitBtn.textContent = isReg ? '创建账户' : '登录';
      nameField.hidden = !isReg;
      document.getElementById('password').autocomplete = isReg ? 'new-password' : 'current-password';
      hideMsg(msg);
    }));

    async function submit() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const name = document.getElementById('name').value.trim();
      submitBtn.disabled = true;
      try {
        const path = mode === 'register' ? '/api/auth/register' : '/api/auth/login';
        const body = mode === 'register' ? { name, email, password } : { email, password };
        await api(path, { method: 'POST', body: JSON.stringify(body) });
        location.href = '/dashboard.html';
      } catch (err) {
        showMsg(msg, err.message, 'err');
        submitBtn.disabled = false;
      }
    }
    submitBtn.addEventListener('click', submit);
    document.getElementById('password').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submit();
    });
  </script>
</body>
</html>
