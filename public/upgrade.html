<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>永久会员 · Smart QR Manager</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="nav" id="nav"></header>

  <div class="container narrow">
    <div class="page-head center">
      <h1 class="page-title">永久会员</h1>
      <p class="page-sub">一次付费，无限创建收集表单。二维码功能始终免费。</p>
    </div>
    <div class="msg" id="msg"></div>

    <div class="card" id="card" hidden>
      <!-- 购买视图 -->
      <div id="buyView">
        <div class="price">
          <span class="cur">¥</span><span class="num" id="price">9.90</span><span class="per">永久有效</span>
        </div>
        <ul class="perks">
          <li><span data-icon="check-circle" data-size="18"></span>无限创建自定义收集表单</li>
          <li><span data-icon="check-circle" data-size="18"></span>6 种填写页风格，可加自定义 Logo</li>
          <li><span data-icon="check-circle" data-size="18"></span>扫码填写、实时统计、CSV 导出</li>
          <li><span data-icon="check-circle" data-size="18"></span>一次付费，永久有效</li>
        </ul>

        <div class="pay-grid">
          <div class="pay-card" id="wxCard">
            <img src="/pay-wechat.png" alt="微信收款码" onerror="this.closest('.pay-card').hidden = true" />
            <div class="lab">微信</div>
          </div>
          <div class="pay-card" id="aliCard">
            <img src="/pay-alipay.png" alt="支付宝收款码" onerror="this.closest('.pay-card').hidden = true" />
            <div class="lab">支付宝</div>
          </div>
        </div>
        <p class="help center" style="margin-top: 14px">扫码支付 ¥<span id="price2">9.90</span>，付款后点下方按钮申请开通。</p>

        <button class="btn block mt-3" id="paidBtn">我已支付，申请开通</button>
        <p class="help center" id="manualNote">管理员确认到账后即为你开通，通常很快。</p>
      </div>

      <!-- 已申请、等待确认 -->
      <div id="pendingView" hidden>
        <div class="banner wait"><span data-icon="clock" data-size="22"></span>已提交开通申请，等待管理员确认到账。</div>
        <p class="help center">确认后本页会自动更新为会员状态，无需操作。</p>
      </div>

      <!-- 已是会员 -->
      <div id="okView" hidden>
        <div class="banner ok"><span data-icon="check-circle" data-size="22"></span>你已是永久会员，可以无限创建表单。</div>
        <a class="btn block mt-2" href="/form-builder.html">去创建表单</a>
      </div>
    </div>
  </div>

  <footer id="footer"></footer>

  <script src="/app.js"></script>
  <script>
    let pollTimer = null;

    (async () => {
      await renderNav('forms');
      if (!(await requireAuth())) return;
      const msg = document.getElementById('msg');
      let cfg;
      try { cfg = await api('/api/billing/config'); }
      catch (err) { showMsg(msg, err.message, 'err'); return; }

      document.getElementById('card').hidden = false;
      document.getElementById('price').textContent = cfg.price;
      document.getElementById('price2').textContent = cfg.price;

      if (cfg.isMember) { showView('okView'); return; }
      if (cfg.hasPendingRequest) { showPending(); return; }

      document.getElementById('paidBtn').addEventListener('click', submitPaidRequest);
    })();

    function showView(id) {
      ['buyView', 'pendingView', 'okView'].forEach((v) => {
        document.getElementById(v).hidden = v !== id;
      });
    }

    function showPending() {
      showView('pendingView');
      // 每 4 秒查一次，管理员确认后自动变会员
      if (!pollTimer) pollTimer = setInterval(checkMember, 4000);
    }

    async function submitPaidRequest() {
      const btn = document.getElementById('paidBtn');
      btn.disabled = true; btn.textContent = '提交中';
      try {
        await api('/api/billing/request', { method: 'POST' });
        showPending();
      } catch (err) {
        if (/已经是会员/.test(err.message)) { showView('okView'); return; }
        showMsg(document.getElementById('msg'), err.message, 'err');
        btn.disabled = false; btn.textContent = '我已支付，申请开通';
      }
    }

    async function checkMember() {
      try {
        const cfg = await api('/api/billing/config');
        if (cfg.isMember) {
          if (pollTimer) clearInterval(pollTimer);
          showView('okView');
        }
      } catch { /* 下次再查 */ }
    }
  </script>
</body>
</html>
