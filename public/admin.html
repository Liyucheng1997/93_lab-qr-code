<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理 · Smart QR Manager</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="nav" id="nav"></header>

  <div class="container">
    <div class="page-head">
      <h1 class="page-title">管理</h1>
      <p class="page-sub">所有注册用户及其二维码、表单</p>
    </div>
    <div class="msg" id="msg"></div>

    <div id="content" hidden>
      <div class="grid grid-3 stat-grid">
        <div class="card"><div class="stat-num" id="tUsers">0</div><div class="stat-label">用户</div></div>
        <div class="card"><div class="stat-num" id="tQr">0</div><div class="stat-label">二维码 · 扫码 <span id="tScans">0</span> 次</div></div>
        <div class="card"><div class="stat-num" id="tForms">0</div><div class="stat-label">表单 · 收集 <span id="tSubs">0</span> 份</div></div>
      </div>

      <div class="section-head" style="margin-top: 32px"><h2>用户</h2></div>
      <div id="userList"></div>
    </div>
  </div>

  <footer id="footer"></footer>

  <script src="/app.js"></script>
  <script>
    const THEME_NAMES = { classic: '简约', business: '商务', elegant: '优雅', vibrant: '活力', nature: '自然', dark: '暗夜' };
    const detailCache = {};

    (async () => {
      await renderNav('admin');
      const me = await requireAuth();
      if (!me) return;
      const msg = document.getElementById('msg');
      if (!me.isAdmin) { showMsg(msg, '你没有访问管理后台的权限', 'err'); return; }

      let data;
      try { data = await api('/api/admin/overview'); }
      catch (err) { showMsg(msg, err.message, 'err'); return; }

      document.getElementById('content').hidden = false;
      document.getElementById('tUsers').textContent = fmtNum(data.totals.users);
      document.getElementById('tQr').textContent = fmtNum(data.totals.qrcodes);
      document.getElementById('tScans').textContent = fmtNum(data.totals.scans);
      document.getElementById('tForms').textContent = fmtNum(data.totals.forms);
      document.getElementById('tSubs').textContent = fmtNum(data.totals.submissions);

      renderUsers(data.users);
    })();

    function renderUsers(users) {
      const wrap = document.getElementById('userList');
      if (!users.length) { wrap.innerHTML = `<div class="card flush">${emptyState('user', '还没有注册用户', '')}</div>`; return; }
      wrap.innerHTML = `<div class="list">` + users.map((u) => `
        <div class="user-block" data-id="${u.id}">
          <div class="user-row" onclick="toggleUser('${u.id}')">
            <span class="caret" id="caret-${u.id}">${icon('chevron-right')}</span>
            <div class="user-who">
              <div class="user-name">${escapeHtml(u.name)}${u.isAdmin ? '<span class="badge accent">管理员</span>' : ''}${u.isPaid ? '<span class="badge black">会员</span>' : ''}${u.pendingRequest && !u.isPaid ? '<span class="badge orange">待开通</span>' : ''}</div>
              <div class="muted small">${escapeHtml(u.email)} · 加入于 ${fmtDate(u.createdAt)}</div>
            </div>
            <div class="user-counts">
              <span><b>${fmtNum(u.qrCount)}</b>二维码</span>
              <span><b>${fmtNum(u.totalScans)}</b>扫码</span>
              <span><b>${fmtNum(u.formCount)}</b>表单</span>
              <span><b>${fmtNum(u.totalSubmissions)}</b>收集</span>
            </div>
            <div class="user-tools">
              ${u.isAdmin ? '' : `<button class="btn ghost sm" onclick="event.stopPropagation();toggleMember('${u.id}',${u.isPaid})">${u.isPaid ? '取消会员' : '设为会员'}</button>`}
              <button class="btn danger sm" onclick="event.stopPropagation();delUser('${u.id}','${escapeHtml(u.name).replace(/'/g, "\\'")}',${u.isAdmin})">删除</button>
            </div>
          </div>
          <div class="user-detail" id="detail-${u.id}" hidden></div>
        </div>`).join('') + `</div>`;
    }

    async function toggleUser(id) {
      const box = document.getElementById('detail-' + id);
      const caret = document.getElementById('caret-' + id);
      const open = !box.hidden;
      if (open) { box.hidden = true; caret.classList.remove('open'); return; }
      box.hidden = false;
      caret.classList.add('open');
      if (!detailCache[id]) {
        box.innerHTML = '<div class="muted small" style="padding: 14px 0">加载中</div>';
        try { detailCache[id] = await api('/api/admin/users/' + id); }
        catch (err) { box.innerHTML = `<div class="msg show err" style="margin-top:14px">${escapeHtml(err.message)}</div>`; return; }
      }
      renderDetail(id, detailCache[id]);
    }

    function renderDetail(id, d) {
      const box = document.getElementById('detail-' + id);
      const qrHtml = d.qrcodes.length ? d.qrcodes.map((q) => `
        <div class="mini">
          <div class="mini-top">
            <div style="min-width: 0">
              <div style="font-weight: 600">${escapeHtml(q.title)}</div>
              <div class="muted">${escapeHtml(q.target)}</div>
              <div class="muted">扫码 <b>${fmtNum(q.scanCount)}</b> 次 · ${fmtDate(q.createdAt)}</div>
            </div>
            <button class="btn danger sm" onclick="delQr('${id}','${q.id}')">删除</button>
          </div>
        </div>`).join('') : '<div class="muted small">无</div>';

      const formHtml = d.forms.length ? d.forms.map((f) => `
        <div class="mini">
          <div class="mini-top">
            <div style="min-width: 0">
              <div style="font-weight: 600">${escapeHtml(f.title)} <span class="badge">${THEME_NAMES[f.theme] || f.theme}</span></div>
              <div class="muted">${f.fields.length} 个字段 · 收集 <b>${fmtNum(f.submissionCount)}</b> 份 · ${fmtDate(f.createdAt)}</div>
            </div>
            <button class="btn danger sm" onclick="delForm('${id}','${f.id}')">删除</button>
          </div>
          ${renderSubs(f)}
        </div>`).join('') : '<div class="muted small">无</div>';

      box.innerHTML = `<h4>二维码 · ${d.qrcodes.length}</h4>${qrHtml}<h4>表单 · ${d.forms.length}</h4>${formHtml}`;
    }

    function renderSubs(f) {
      if (!f.submissions.length) return '';
      const cols = f.fields;
      const head = '<th>提交时间</th>' + cols.map((c) => `<th>${escapeHtml(c.label)}</th>`).join('');
      const rows = f.submissions.map((s) => {
        const cells = cols.map((c) => {
          let v = s.data[c.id];
          if (Array.isArray(v)) v = v.join(' / ');
          return `<td>${escapeHtml(v == null ? '' : v)}</td>`;
        }).join('');
        return `<tr><td>${fmtDate(s.at)}</td>${cells}</tr>`;
      }).join('');
      return `<details><summary>展开 ${f.submissions.length} 条提交</summary>
        <div class="table-wrap"><table class="sub-table"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div></details>`;
    }

    async function toggleMember(id, isPaid) {
      const turnOn = !isPaid;
      if (!confirm(turnOn ? '确定将该用户设为会员？（用于线下/手动开通）' : '确定取消该用户的会员资格？')) return;
      try {
        await api('/api/admin/users/' + id + '/membership', { method: 'POST', body: JSON.stringify({ isPaid: turnOn }) });
        reload();
      } catch (err) { alert(err.message); }
    }

    async function delUser(id, name, isAdmin) {
      if (isAdmin) { alert('不能删除管理员账号'); return; }
      if (!confirm(`确定删除用户「${name}」及其全部二维码和表单？此操作不可恢复。`)) return;
      try { await api('/api/admin/users/' + id, { method: 'DELETE' }); reload(); }
      catch (err) { alert(err.message); }
    }
    async function delQr(uid, qid) {
      if (!confirm('确定删除该二维码？扫码记录将一并删除，不可恢复。')) return;
      try { await api('/api/admin/qrcodes/' + qid, { method: 'DELETE' }); delete detailCache[uid]; reload(); }
      catch (err) { alert(err.message); }
    }
    async function delForm(uid, fid) {
      if (!confirm('确定删除该表单？收集到的数据将一并删除，不可恢复。')) return;
      try { await api('/api/admin/forms/' + fid, { method: 'DELETE' }); delete detailCache[uid]; reload(); }
      catch (err) { alert(err.message); }
    }
    function reload() { location.reload(); }
  </script>
</body>
</html>
