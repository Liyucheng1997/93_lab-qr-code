<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的 · Smart QR Manager</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="nav" id="nav"></header>

  <div class="container">
    <div class="page-head">
      <h1 class="page-title">我的</h1>
      <p class="page-sub">账户信息与你的全部项目</p>
    </div>
    <div class="msg" id="msg"></div>

    <div id="content" hidden>
      <!-- Account card -->
      <div class="card">
        <div class="account">
          <div class="avatar" id="avatar"></div>
          <div class="account-main">
            <div class="account-name" id="uName"></div>
            <div class="muted" id="uEmail"></div>
            <div class="muted small" id="uJoined" style="margin-top: 2px"></div>
          </div>
          <div class="account-side" id="memberBox"></div>
        </div>
      </div>

      <!-- Stat summary -->
      <div class="grid grid-3 stat-grid mt-2">
        <div class="card"><div class="stat-num" id="sQr">0</div><div class="stat-label">二维码</div></div>
        <div class="card"><div class="stat-num" id="sScan">0</div><div class="stat-label">累计扫码</div></div>
        <div class="card"><div class="stat-num" id="sForm">0</div><div class="stat-label">表单 · 收集 <span id="sSub">0</span> 份</div></div>
      </div>

      <!-- QR projects -->
      <div class="section-head">
        <h2>我的二维码</h2>
        <a class="btn ghost sm" href="/create.html"><span data-icon="plus"></span>新建</a>
      </div>
      <div id="qrList"></div>

      <!-- Form projects -->
      <div class="section-head">
        <h2>我的表单</h2>
        <a class="btn ghost sm" id="newForm" href="/form-builder.html"><span data-icon="plus"></span>新建</a>
      </div>
      <div id="formList"></div>
    </div>
  </div>

  <footer id="footer"></footer>

  <script src="/app.js"></script>
  <script>
    const THEME_NAMES = { classic: '简约', business: '商务', elegant: '优雅', vibrant: '活力', nature: '自然', dark: '暗夜' };

    (async () => {
      await renderNav('profile');
      if (!(await requireAuth())) return;
      const msg = document.getElementById('msg');
      let p;
      try { p = await api('/api/profile'); }
      catch (err) { showMsg(msg, err.message, 'err'); return; }

      document.getElementById('content').hidden = false;
      document.getElementById('avatar').textContent = (p.user.name || '?').slice(0, 1).toUpperCase();
      document.getElementById('uName').textContent = p.user.name;
      document.getElementById('uEmail').textContent = p.user.email;
      document.getElementById('uJoined').textContent = '加入于 ' + fmtDate(p.user.createdAt);

      const memberBox = document.getElementById('memberBox');
      if (p.user.isPaid || p.user.isMember) {
        memberBox.innerHTML = `<span class="badge black">${icon('star', 12, 2)}永久会员</span>` +
          (p.user.paidAt ? `<div class="vip-since">${fmtDate(p.user.paidAt)} 开通</div>` : '');
      } else {
        memberBox.innerHTML = `<a class="btn ghost sm" href="/upgrade.html">开通会员</a>`;
        document.getElementById('newForm').href = '/upgrade.html';
      }
      document.getElementById('sQr').textContent = fmtNum(p.stats.qrCount);
      document.getElementById('sScan').textContent = fmtNum(p.stats.totalScans);
      document.getElementById('sForm').textContent = fmtNum(p.stats.formCount);
      document.getElementById('sSub').textContent = fmtNum(p.stats.totalSubmissions);

      const qrList = document.getElementById('qrList');
      qrList.innerHTML = p.qrcodes.length ? `<div class="list">` + p.qrcodes.map((q) => `
        <div class="list-row" data-href="/detail.html?id=${q.id}">
          <img class="list-thumb" src="/api/qrcodes/${q.id}/image" alt="" />
          <div class="list-main">
            <h3 class="list-title">${escapeHtml(q.title)}</h3>
            <div class="list-sub">${escapeHtml(q.target)}</div>
            <div class="list-meta">创建于 ${fmtDate(q.createdAt)}</div>
          </div>
          <div class="list-stat"><div class="n">${fmtNum(q.scanCount)}</div><div class="l">次扫码</div></div>
          <div class="list-actions">
            <a class="btn ghost sm" href="/stats.html?id=${q.id}">统计</a>
          </div>
          <span class="list-chevron">${icon('chevron-right')}</span>
        </div>`).join('') + `</div>`
        : `<div class="card flush">${emptyState('qr', '还没有二维码', '创建第一个动态二维码。', `<a class="btn" href="/create.html">${icon('plus')}创建二维码</a>`)}</div>`;

      const formList = document.getElementById('formList');
      formList.innerHTML = p.forms.length ? `<div class="list">` + p.forms.map((f) => `
        <div class="list-row" data-href="/form-detail.html?id=${f.id}">
          <img class="list-thumb" src="/api/forms/${f.id}/image" alt="" />
          <div class="list-main">
            <h3 class="list-title">${escapeHtml(f.title)} <span class="badge">${THEME_NAMES[f.theme] || f.theme}</span></h3>
            <div class="list-meta">${f.fieldCount} 个字段 · 创建于 ${fmtDate(f.createdAt)}</div>
          </div>
          <div class="list-stat"><div class="n">${fmtNum(f.submissionCount)}</div><div class="l">份提交</div></div>
          <div class="list-actions">
            <a class="btn ghost sm" href="/form-submissions.html?id=${f.id}">结果</a>
          </div>
          <span class="list-chevron">${icon('chevron-right')}</span>
        </div>`).join('') + `</div>`
        : `<div class="card flush">${emptyState('form', '还没有表单', '设计一份表单，扫码即可收集信息。')}</div>`;
    })();
  </script>
</body>
</html>
